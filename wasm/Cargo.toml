[package]
name = "giftcardswasm"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
opt-level = "z"
strip = true

[dependencies]
wit-bindgen = "0.41"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
getrandom = { version = "0.2", features = ["custom"] }
sha2 = "0.10"
base64 = "0.22"

[package.metadata.component]
target = { path = "wit/world.wit", world = "giftcards" }
